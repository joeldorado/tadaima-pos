# nginx del servicio Cloud Run `tadaimaus` (solo estáticos del dist de Vite).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets fingerprinteados por Vite: cache inmutable de 1 año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es el que apunta a los assets nuevos tras cada
    # deploy (mismo criterio que la PWA del POS — evitar bundles viejos pegados).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Router hash (#/...): el path del documento siempre es /, pero el fallback
    # cubre cualquier entrada rara sin dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
